services:
  db:
    image: postgres:16.4-alpine
    container_name: postgres_container
    hostname: ${POSTGRES_HOST}
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db_init_scripts:/docker-entrypoint-initdb.d
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8.11.0
    env_file:
      - .env
    container_name: pgadmin_container
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGADMIN_PORT=${PGADMIN_PORT}
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - ./pgadmin-init.sh:/entrypoint_custom.sh
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    user: root
    entrypoint: /entrypoint_custom.sh
    ports:
      - $PGADMIN_PORT:80
    networks:
      - app_network

  api_server:
    env_file:
      - .env
    build:
      context: api_server
      dockerfile: Dockerfile
      args:
        PORT: ${API_SERVER_PORT}
    image: api_server_image
    container_name: api_server_container
    ports:
      - ${API_SERVER_PORT}:${API_SERVER_PORT}
    volumes:
      - ./api_server:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_SERVER_PORT}/health"]
      interval: 120s
      timeout: 5s
      retries: 3

  react_app:
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=1000
      - REACT_APP_PORT=${REACT_APP_PORT}
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
      - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
      - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
    build:
      context: react_app
      dockerfile: Dockerfile
      args:
        PORT: ${REACT_APP_PORT}
    image: react_app_image
    container_name: react_container
    ports:
      - ${REACT_APP_PORT}:${REACT_APP_PORT}
    volumes:
      - ./react_app:/app
      - /app/node_modules
    depends_on:
      - db
      - api_server
    networks:
      - app_network
  
  ollama:
    build:
      context: llm
      dockerfile: Dockerfile
    container_name: ollama_container
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - app_network
    # Optional: GPU Support (If NVIDIA GPU and drivers installed)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  llm_server:
    env_file:
      - .env
    build:
      context: llm/server
      dockerfile: Dockerfile
      args:
        PORT: ${LLM_SERVER_PORT}
    image: llm_server_image
    container_name: llm_server_container
    environment:
      - OLLAMA_HOST=ollama_container
      - OLLAMA_PORT=11434
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - LLM_SERVER_PORT=${LLM_SERVER_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_HINT_MODEL=${GROQ_HINT_MODEL:-llama-3.3-70b-versatile}
      - API_SERVER_HOST=api_server_container
      - API_SERVER_PORT=${API_SERVER_PORT}
    ports:
      - ${LLM_SERVER_PORT}:${LLM_SERVER_PORT}
    volumes:
      - ./llm/server:/app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${LLM_SERVER_PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  rustfs:
    image: rustfs/rustfs
    container_name: rustfs_container
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ROOT_USER=${S3_ACCESS_KEY}
      - RUSTFS_ROOT_PASSWORD=${S3_SECRET_KEY}
    networks:
      - app_network

  whisper_server:
    build:
      context: whisper_server
      dockerfile: Dockerfile
    image: whisper_server_image
    container_name: whisper_server_container
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL}
      - WHISPER_PORT=${WHISPER_PORT}
    ports:
      - "${WHISPER_PORT:-8001}:${WHISPER_PORT:-8001}"
    volumes:
      - whisper_cache:/root/.cache/whisper
    restart: unless-stopped
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${WHISPER_PORT:-8001}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app_network:
    driver: bridge

volumes:
  pg_data:
  pgadmin_data:
  ollama_data:
  rustfs_data:
  whisper_cache:
